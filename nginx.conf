# Fast downloads: serves /hlds/ts as sv_downloadurl. Only the file types clients download are
# served, so cfgs (rcon_password), libraries and logs stay private.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    log_format fastdl 'fastdl: $remote_addr $status $body_bytes_sent $uri';
    access_log /dev/stdout fastdl;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    sendfile on;
    tcp_nopush on;
    server_tokens off;
    default_type application/octet-stream;

    server {
        listen @HTTP_PORT@;
        listen [::]:@HTTP_PORT@;
        root /hlds/ts;
        autoindex off;

        location ~* ^/(maps|models|sound|sprites|gfx|overviews|resource|media|events)/.+\.(bsp|res|txt|wad|mdl|spr|wav|mp3|tga|bmp|sc)$ {
            try_files $uri =404;
        }
        location ~* ^/[^/]+\.wad$ {
            try_files $uri =404;
        }
        location / {
            return 404;
        }
    }
}
