services:
  tsmod:
    build:
      context: .
      # amd64 for the 64-bit engine (see README.md).
      args:
        ARCH: i386
    image: tsmod
    restart: unless-stopped
    ports:
      - "27015:27015/udp"
      - "27015:27015/tcp"
      - "27080:27080/tcp"
    environment:
      SERVER_NAME: "The Specialists (Rust port)"
      MAP: ts_dojo
      MAXPLAYERS: 16
      BOTS: 8
      # 21 for TS 2.1's rules (Rust port clients only), 30 for 3.0's; empty leaves it to server.cfg.
      GAMEPLAY: ""
      # rcbot for RCBot's bots (BOTS of them), native for TS's own; empty leaves it to server.cfg.
      BOT_BACKEND: ""
      RCON_PASSWORD: ""
      # The address players reach this host on (looked up when empty); maps download from
      # http://PUBLIC_HOST:27080/.
      PUBLIC_HOST: ""
      # Or download from another site that serves this server's ts/ folder there:
      # FASTDL_URL: https://tsmod.org/content/
    volumes:
      - ./custom:/custom:ro
      # Bans (banned.cfg, listip.cfg) and RCBot's data (rcbot/: what its bots learn, waypoints).
      # A bind mount (./data:/data) works too if uid 1000 can write to it.
      - data:/data

volumes:
  data:
